<script>
(function () {

  const STATUS_URL = "/free-help-status.json";

  const SHOW_DELAY = 4000;
  const SHOW_ON_SCROLL = true;

  const REPEAT_MINUTES = 4;          // ⬅️ повтор не чаще чем раз в 4 минуты
  const CHECK_INTERVAL = 12000;      // ⬅️ проверка статуса каждые 12 секунд

  let LIVE_URL = null;

  let popupShown = false;      // уже показали popup
  let initialized = false;     // защита от повторного init
  let pollingStarted = false;  // защита от двойного polling

  // -----------------------------
  // 1. Проверка статуса стрима
  // -----------------------------
  function checkStatus() {
    fetch(STATUS_URL, { cache: "no-store" })
      .then(r => r.json())
      .then(data => {

        if (!data.live || popupShown) return;

        LIVE_URL = data.url;

        const lastClosed = localStorage.getItem('vnutri_live_closed');

        if (
          lastClosed &&
          (Date.now() - lastClosed < REPEAT_MINUTES * 60 * 1000)
        ) {
          return;
        }

        init();

      })
      .catch(() => {
        // молча игнорим ошибки сети
      });
  }

  // -----------------------------
  // 2. Запуск polling
  // -----------------------------
  function startPolling() {
    if (pollingStarted) return;
    pollingStarted = true;

    checkStatus();
    setInterval(checkStatus, CHECK_INTERVAL);
  }

  // -----------------------------
  // 3. Основная инициализация
  // -----------------------------
  function init() {
    if (initialized) return;
    initialized = true;

    function createPopup() {
      if (popupShown) return;
      popupShown = true;

      const popup = document.createElement('div');

      popup.innerHTML = `
        <div id="vnutri-live-popup" style="
          position: fixed;
          bottom: 20px;
          right: 20px;
          width: 340px;
          max-width: calc(100% - 20px);
          background: linear-gradient(135deg, #111, #1a1a1a);
          color: #fff;
          padding: 18px;
          border-radius: 16px;
          box-shadow: 0 20px 60px rgba(0,0,0,0.5);
          font-family: -apple-system, BlinkMacSystemFont, sans-serif;
          z-index: 9999;
          transform: translateY(20px);
          opacity: 0;
          transition: all 0.35s ease;
        ">

          <div style="display:flex; align-items:center; gap:8px; font-size:13px; opacity:0.75; margin-bottom:8px;">
            <span style="color:#ff3b30;">●</span>
            Vnutri Apps
          </div>

          <div style="font-size:17px; font-weight:600; line-height:1.3; margin-bottom:12px;">
            Сегодня есть бесплатный слот на встречу от Vnutri Apps
          </div>

          <div style="display:flex; gap:10px;">
            <a href="${LIVE_URL}" target="_blank"
              style="
                flex:1;
                text-align:center;
                background:#4CAF50;
                color:#fff;
                padding:10px;
                border-radius:10px;
                text-decoration:none;
                font-weight:600;
              ">
              Подробнее →
            </a>

            <button id="vnutri-close"
              style="
                background:#2a2a2a;
                color:#aaa;
                border:none;
                padding:10px 12px;
                border-radius:10px;
                cursor:pointer;
              ">
              ✕
            </button>
          </div>
        </div>
      `;

      document.body.appendChild(popup);

      const box = document.getElementById('vnutri-live-popup');

      requestAnimationFrame(() => {
        box.style.transform = "translateY(0)";
        box.style.opacity = "1";
      });

      document.getElementById('vnutri-close').onclick = () => {
        box.style.opacity = "0";
        box.style.transform = "translateY(20px)";
        setTimeout(() => popup.remove(), 300);

        localStorage.setItem('vnutri_live_closed', Date.now());
      };
    }

    function start() {
      setTimeout(createPopup, SHOW_DELAY);
    }

    if (SHOW_ON_SCROLL) {
      let triggered = false;

      window.addEventListener('scroll', () => {
        if (triggered) return;
        triggered = true;
        start();
      });

    } else {
      start();
    }
  }

  // -----------------------------
  // старт системы
  // -----------------------------
  startPolling();

})();
</script>
