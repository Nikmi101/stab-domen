{% capture home_url %}{{ "/" | absolute_url }}{% endcapture %}
{% capture blog_url %}{{ "/blog/" | absolute_url }}{% endcapture %}
{% capture page_url %}{{ page.url | absolute_url }}{% endcapture %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Vnutri Apps",
      "url": {{ home_url | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Статьи от Vnutri Apps",
      "url": {{ blog_url | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }},
      "url": {{ page_url | jsonify }}
    }
  ]
}
</script>
